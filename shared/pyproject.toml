[project]
name = "wheeler-shared"
version = "0.1.0"
description = "Wspólny model danych, kolejka zadań i magazyn plików Wheelera"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheeler_shared"]
