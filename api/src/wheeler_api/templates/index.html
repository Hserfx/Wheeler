{% extends "base.html" %}
{% block content %}
<section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="text-xl font-semibold">{{ t.upload_heading }}</h1>
  <p class="mt-1 text-sm text-slate-500">{{ t.upload_hint }}</p>

  {% if error %}
  <p class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
  {% endif %}

  <form action="/jobs" method="post" enctype="multipart/form-data" class="mt-6 flex flex-col gap-4"
        x-data="{ fileName: '', sending: false }" @submit="sending = true">
    <label class="flex cursor-pointer items-center gap-3">
      <span class="rounded-md border border-slate-300 bg-slate-100 px-4 py-2 text-sm font-medium hover:bg-slate-200">
        {{ t.upload_choose }}
      </span>
      <span class="text-sm text-slate-600" x-text="fileName || '{{ t.upload_no_file_chosen }}'">{{ t.upload_no_file_chosen }}</span>
      <input type="file" name="photo" accept="image/*" class="sr-only" required
             @change="fileName = $event.target.files[0]?.name ?? ''">
    </label>
    <div>
      <button type="submit" :disabled="sending || !fileName"
              class="rounded-md bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50">
        <span x-show="!sending">{{ t.upload_submit }}</span>
        <span x-show="sending" x-cloak>{{ t.upload_sending }}</span>
      </button>
    </div>
  </form>
</section>
{% endblock %}
