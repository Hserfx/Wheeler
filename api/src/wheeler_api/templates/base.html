<!doctype html>
<html lang="pl" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='alpine.min.js') }}" defer></script>
</head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-baseline justify-between gap-4 px-4 py-3">
      <div class="flex items-baseline gap-4">
        <a href="/" class="text-lg font-semibold">{{ t.app_name }}</a>
        <span class="hidden text-sm text-slate-500 sm:inline">{{ t.app_tagline }}</span>
      </div>
      <nav class="flex items-baseline gap-4 text-sm font-medium text-slate-600">
        <span hx-get="/model-state" hx-trigger="load" hx-swap="outerHTML"></span>
        <a href="/" class="hover:text-slate-900">{{ t.nav_home }}</a>
        <a href="/history" class="hover:text-slate-900">{{ t.nav_history }}</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
