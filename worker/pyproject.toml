[project]
name = "wheeler-worker"
version = "0.1.0"
description = "Natywny worker AI Wheelera (macOS, MLX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wheeler-shared",
    "pillow>=10.4",
    "numpy>=2.0",
    # Elipsa felgi i radialny warp przy zmianie rozmiaru felgi (ticket 12); i tak przychodzi z mflux.
    "opencv-python>=4.10",
    # Modele AI (ładowane leniwie, tylko w procesorze `wheel-swap`): mflux (MLX) + SAM 2 i BiRefNet (torch).
    "mflux",
    "torch>=2.13",
    "torchvision>=0.29.1",
    "transformers>=5.5,<6",
    "pillow-heif>=1.0",
    # BiRefNet (usuwanie tła felgi) ma kod modelu w repozytorium HF i potrzebuje tych bibliotek.
    "timm>=1.0",
    "kornia>=0.8",
    "einops>=0.8",
]

[project.scripts]
wheeler-worker = "wheeler_worker.__main__:main"

[tool.uv.sources]
wheeler-shared = { workspace = true }
# Qwen-Image-2.1-Turbo jest na main mflux (PR #859), nie w wydanym 0.22.0 (spike 01).
mflux = { git = "https://github.com/mflux-community/mflux", rev = "b534021a9c8c45bb064959d754870fd98322e447" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheeler_worker"]
