[project]
name = "wheeler-api"
version = "0.1.0"
description = "Aplikacja webowa Wheelera (FastAPI + Jinja2 + HTMX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wheeler-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
wheeler-api = "wheeler_api.__main__:main"

[tool.uv.sources]
wheeler-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheeler_api"]
